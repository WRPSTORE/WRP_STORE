function render(){ $('opening').classList.toggle('active',mode==='opening');$('regular').classList.toggle('active',mode==='regular');$('currency').textContent=currency==='KWD'?'🇰🇼 KWD':'🇺🇸 USD';$('priceInfo').textContent=mode==='opening'?'أسعار الافتتاح التركية محوّلة تقديرياً إلى الدينار؛ البونص المضاعف لبعض الباقات يعتمد على أول شحن.':'الأسعار الدائمة الكويتية: السعر قبل الخصم وبعده، وبونص الكويت.';$('packages').innerHTML=data.map(p=>`<article class="pack"><div class="uc">${total(p).toLocaleString('en-US')} UC</div><div class="uc-coins" aria-hidden="true"><span class="coin-stack stack-left"><i></i><i></i><i></i><i></i></span><span class="coin-stack stack-center"><i></i><i></i><i></i><i></i><i></i></span><span class="coin-stack stack-right"><i></i><i></i><i></i></span><span class="uc-ingot"><b>UC</b></span><span class="uc-spark spark-a">✦</span><span class="uc-spark spark-b">✧</span></div><div class="bonus">${p.b.toLocaleString('en-US')} أساسية + ${bonus(p).toLocaleString('en-US')} إضافية</div>${mode==='regular'?`<del>${price(p.k0)}</del>`:'<del>عرض افتتاح</del>'}<div class="price">${price(amount(p))}</div><button type="button" data-pick="${p.n}">اختيار الباقة</button></article>`).join('');$('packages').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{$('package').value=b.dataset.pick;summary();$('order').scrollIntoView({behavior:'smooth'})});summary()}
function summary(){const p=selected();$('summary').textContent='الباقة: '+p.b+' UC أساسية + '+bonus(p)+' UC إضافية = '+total(p)+' UC | السعر المعروض: '+price(amount(p))+' | آيدي اللاعب: '+($('player').value||'—')}
function message(){const id=$('player').value.trim();if(!/^\d{5,15}$/.test(id)){$('status').textContent='اكتبي آيدي اللاعب الصحيح من 5 إلى 15 رقم.';$('player').focus();return null}const p=selected();return ['طلب شحن WRB STORE','آيدي اللاعب: '+id,'نوع السعر: '+(mode==='opening'?'عرض الافتتاح':'الأسعار الدائمة'),'الشدات الأساسية: '+p.b+' UC','الشدات الإضافية: '+bonus(p)+' UC','الإجمالي: '+total(p)+' UC','السعر المعروض: '+price(amount(p)),'السعر النهائي يؤكد قبل الدفع','طريقة الدفع: تحويل بنكي فقط'].join('\n')}
async function copy(msg){try{await navigator.clipboard.writeText(msg);return true}catch(e){const el=document.createElement('textarea');el.value=msg;document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();return ok}}
$('opening').onclick=()=>{mode='opening';render()};$('regular').onclick=()=>{mode='regular';render()};$('navRegular').onclick=()=>{mode='regular';render()};$('currency').onclick=()=>{currency=currency==='KWD'?'USD':'KWD';render()};$('player').oninput=summary;$('package').onchange=summary;$('copy').onclick=async()=>{const m=message();if(m)$('status').textContent=await copy(m)?'تم نسخ تفاصيل الطلب.':'تعذر النسخ.'};$('wa').onclick=()=>{const m=message();if(m){window.open('https://wa.me/905345038746?text='+encodeURIComponent(m),'_blank','noopener');$('status').textContent='تم فتح واتساب. اضغطي إرسال داخل المحادثة.'}};$('tg').onclick=async()=>{const m=message();if(!m)return;const win=window.open('https://t.me/WRP_STORE','_blank','noopener');const ok=await copy(m);$('status').textContent=ok?'تم نسخ الطلب. الصقيه في محادثة تليجرام ثم أرسليه.':'انسخي الطلب يدوياً ثم أرسليه في تليجرام.'};$('package').innerHTML=data.map(p=>`<option value="${p.n}">${p.n.toLocaleString('en-US')} UC</option>`).join('');render();
</script></body></html>
